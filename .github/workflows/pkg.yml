name: Pkg sync

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pkg_sync:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: install dependencies
        run: pnpm install
      - name: transpile typescript
        run: pnpm run build
      - name: run tests
        run: pnpm test
      - name: sync pkg branch
        run: pnpm ws pkg-sync